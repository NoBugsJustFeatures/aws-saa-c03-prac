services:
  practice-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-saa-practice-web
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - APP_DOMAIN=${APP_DOMAIN:-saa-practice.local}
      - PRACTICES_DIR=/app/practices
    expose:
      - "3000"
    networks:
      - nginx-proxy-manager-net


  # Local OpenAI-compatible gateway over free LLM tiers. Only used offline by
  # scripts/generate-explanations.js, never by the deployed site.
  # Dashboard (connect providers once): http://localhost:20128
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: saa-omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      REQUIRE_API_KEY: "false"
    volumes:
      - omniroute_data:/app/data
    ports:
      - "127.0.0.1:20128:20128"

volumes:
  omniroute_data:

networks:
  nginx-proxy-manager-net:
    external: true
